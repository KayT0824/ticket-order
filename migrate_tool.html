<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資料搬遷工具（一次性使用）</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  body{
    font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
    max-width:640px;
    margin:0 auto;
    padding:24px 16px 60px;
    background:#F5F6F8;
    color:#1B2430;
  }
  h1{font-size:20px;}
  .card{
    background:#fff;
    border-radius:12px;
    padding:18px;
    margin-top:16px;
    border:1px solid #E0E3E8;
  }
  button{
    background:#1B2430;
    color:#fff;
    border:none;
    border-radius:8px;
    padding:12px 18px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
    margin-right:8px;
  }
  button:disabled{opacity:0.5;cursor:default;}
  button.danger{background:#C1443C;}
  #log{
    background:#111;
    color:#0F0;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    padding:14px;
    border-radius:8px;
    margin-top:14px;
    white-space:pre-wrap;
    word-break:break-word;
    max-height:400px;
    overflow-y:auto;
  }
  .event-name{font-weight:700;}
  .hint{font-size:13px;color:#666;margin-top:6px;}
</style>
</head>
<body>

<h1>⚠️ 一次性資料搬遷工具</h1>
<p class="hint">把舊系統（Google 試算表 / Apps Script）裡的場次資料，複製一份寫進 Firebase。這個工具用完就可以關掉、不用留著。</p>

<div class="card">
  <div>要搬遷的場次：</div>
  <div class="event-name">1. 1121_83z桃園場</div>
  <div class="event-name">2. 1016_銀赫Fancon(台北)</div>
  <div class="hint">執行前不會刪除舊系統裡的任何資料，Google 試算表原封不動保留當備份。重複執行同一場也不會壞掉，只會覆蓋成最新的一份。</div>
  <button id="migrateBtn">開始搬遷這兩場</button>
</div>

<div id="log"></div>

<script>
const OLD_API_URL = 'https://script.google.com/macros/s/AKfycbyljXc7_XkYqXE4zMDdjPtaCjFs3W5749Ec4nYIbJhF6uXV0MSucoyfy9NSFkvO_IkX/exec';

const firebaseConfig = {
  apiKey: "AIzaSyAg4Q2iDBwLEZrm3aAN_veP_CSdi0iN-Cg",
  authDomain: "ticket-order.firebaseapp.com",
  databaseURL: "https://ticket-order-default-rtdb.firebaseio.com",
  projectId: "ticket-order",
  storageBucket: "ticket-order.firebasestorage.app",
  messagingSenderId: "804053169904",
  appId: "1:804053169904:web:45f9583b309ed8216c3435"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const EVENTS = ['1121_83z桃園場', '1016_銀赫Fancon(台北)'];

const logEl = document.getElementById('log');
function log(msg){
  logEl.textContent += msg + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}

function sanitizeKey(str){
  return encodeURIComponent(str).replace(/\./g, '%2E');
}

async function fetchOld(action, event){
  const res = await fetch(`${OLD_API_URL}?action=${action}&event=${encodeURIComponent(event)}`);
  return await res.json();
}

async function migrateEvent(event){
  log(`\n=== 開始搬遷「${event}」===`);

  try{
    const orders = await fetchOld('getOrders', event);
    log(`讀到 ${orders.length} 筆登記資料`);

    const volunteers = await fetchOld('getVolunteers', event);
    log(`讀到 ${volunteers.length} 位志工`);

    const titleData = await fetchOld('getTitle', event);
    const title = titleData.title || '';
    log(`標題: ${title || '(空白)'}`);

    const deadlineData = await fetchOld('getDeadline', event);
    const deadline = deadlineData.deadline || '';
    log(`截止日期: ${deadline || '(未設定)'}`);

    // 寫入訂單資料，依照原本順序給予 order 數字
    for(let i = 0; i < orders.length; i++){
      const o = orders[i];
      const key = sanitizeKey(o.name);
      await db.ref(`events/${event}/orders/${key}`).set({
        name: o.name,
        qty: o.qty,
        price: (o.price === null || o.price === undefined) ? null : o.price,
        order: i + 1,
        ts: o.ts || Date.now()
      });
      log(`  ✓ 登記：${o.name}`);
    }

    // 寫入志工資料
    for(const v of volunteers){
      const key = sanitizeKey(v.name);
      await db.ref(`events/${event}/volunteers/${key}`).set({
        name: v.name,
        ts: v.ts || Date.now()
      });
      log(`  ✓ 志工：${v.name}`);
    }

    // 寫入場次標題/截止日期
    await db.ref(`eventsIndex/${event}`).set({
      title: title,
      deadline: deadline
    });
    log(`✅「${event}」搬遷完成！`);

  }catch(e){
    log(`❌「${event}」搬遷失敗：${e.message || e}`);
  }
}

document.getElementById('migrateBtn').addEventListener('click', async () => {
  const btn = document.getElementById('migrateBtn');
  btn.disabled = true;
  btn.textContent = '搬遷中…請稍候';
  log('開始執行搬遷…');

  for(const event of EVENTS){
    await migrateEvent(event);
  }

  log('\n🎉 全部場次搬遷完成！請到 v2.html 打開這兩場確認資料是否正確。');
  btn.textContent = '搬遷完成';
});
</script>

</body>
</html>
