<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>購票登記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1F6;
    --card:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6472;
    --gold:#E8A23D;
    --gold-deep:#C97F1F;
    --stamp:#C1443C;
    --line:#C9CDD3;
    --line-soft:#DEE1E6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:20px 16px 60px;
  }

  /* ---- Ticket stub header (signature element) ---- */
  .stub{
    display:flex;
    background:var(--ink);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(27,36,48,0.18);
    position:relative;
  }
  .warn-banner{
    background:#FBEAE8;
    border:1px solid #F0BDB8;
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .warn-text{
    color:var(--stamp);
    font-size:13.5px;
    font-weight:600;
    flex:1;
    min-width:200px;
  }
  .warn-btn{
    background:var(--stamp);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:9px 14px;
    font-size:13px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    white-space:nowrap;
  }
  .warn-btn:hover{background:#A6392F;}
  .form-locked{
    opacity:0.45;
    pointer-events:none;
  }
  .stub-main{
    flex:1;
    padding:22px 20px;
    min-width:0;
  }
  .stub-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .stub-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
    color:#fff;
    line-height:1.3;
    word-break:break-word;
  }
  .stub-title-input{
    background:transparent;
    border:none;
    border-bottom:1px dashed rgba(255,255,255,0.35);
    color:#fff;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
    width:100%;
    padding:2px 0 4px;
    outline:none;
  }
  .stub-title-input::placeholder{color:rgba(255,255,255,0.45);}
  .stub-edit{
    margin-top:10px;
    background:none;
    border:none;
    color:rgba(255,255,255,0.55);
    font-size:12px;
    cursor:pointer;
    padding:0;
    font-family:'Inter',sans-serif;
    text-decoration:underline;
  }
  .event-tag{
    margin-top:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:rgba(232,162,61,0.75);
    letter-spacing:0.03em;
  }
  .deadline-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:6px;
    flex-wrap:wrap;
  }
  .deadline-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:rgba(255,255,255,0.65);
  }
  .deadline-tag.passed{
    color:#F0938A;
    font-weight:600;
  }
  .stub-divider{
    width:0;
    border-left:2px dashed rgba(255,255,255,0.25);
    position:relative;
  }
  .stub-divider::before,.stub-divider::after{
    content:'';
    position:absolute;
    left:-9px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--paper);
  }
  .stub-divider::before{top:-9px;}
  .stub-divider::after{bottom:-9px;}
  .stub-counter{
    width:132px;
    padding:22px 16px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    gap:10px;
  }
  .counter-block .num{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:26px;
    color:var(--gold);
    line-height:1;
  }
  .counter-block .lbl{
    font-size:10px;
    color:rgba(255,255,255,0.55);
    letter-spacing:0.08em;
    margin-top:4px;
  }

  /* ---- Form card ---- */
  .card{
    background:var(--card);
    border-radius:14px;
    padding:20px;
    margin-top:16px;
    box-shadow:0 1px 3px rgba(27,36,48,0.06);
    border:1px solid var(--line-soft);
  }
  .card h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    margin:0 0 14px;
    color:var(--ink);
  }
  .field-row{
    display:flex;
    gap:10px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .field label{
    font-size:12px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .field input{
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-size:15px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    outline:none;
    width:100%;
  }
  .field input:focus{border-color:var(--gold-deep);}
  .field.name{flex:1.4;}
  .field.qty{flex:1;}
  .field.price{flex:1.3;}
  .price-check{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--ink-soft);
    font-weight:500;
    cursor:pointer;
  }
  .price-check input{width:auto;}
  .field input:disabled{background:#F2F3F5;color:var(--ink-soft);cursor:not-allowed;}
  .card-header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .card-header-row h2{margin:0;}
  .export-btn{
    background:none;
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 12px;
    font-size:12.5px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
  }
  .export-btn:hover{border-color:var(--gold-deep);color:var(--gold-deep);}
  .no-price-tag{
    color:var(--ink-soft);
    font-style:italic;
    font-family:'Inter',sans-serif;
  }
  .volunteer-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
  }
  .volunteer-chip{
    display:flex;
    align-items:center;
    gap:6px;
    background:#FBF0DC;
    border:1px solid #EFD9AC;
    color:var(--gold-deep);
    border-radius:999px;
    padding:6px 10px 6px 14px;
    font-size:13px;
    font-weight:600;
  }
  .volunteer-chip button{
    background:none;
    border:none;
    color:var(--gold-deep);
    cursor:pointer;
    font-size:13px;
    padding:0 2px;
    line-height:1;
    opacity:0.6;
  }
  .volunteer-chip button:hover{opacity:1;}
  .volunteer-empty{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:10px;
  }
  .submit-btn{
    margin-top:14px;
    width:100%;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:12px;
    font-size:15px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .submit-btn:hover{background:#2B3646;}
  .submit-btn:disabled{opacity:0.5;cursor:default;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:8px;}

  /* ---- Table ---- */
  .list-card{margin-top:16px;}
  table{width:100%;border-collapse:collapse;}
  thead th{
    text-align:left;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding:0 8px 10px;
    border-bottom:1px solid var(--line-soft);
    font-weight:600;
  }
  thead th.num-col{text-align:right;}
  tbody td{
    padding:12px 8px;
    border-bottom:1px solid var(--line-soft);
    font-size:14.5px;
  }
  tbody td.num-col{text-align:right;font-family:'IBM Plex Mono',monospace;}
  tbody tr:last-child td{border-bottom:none;}
  .name-cell{font-weight:600;}
  .del-btn{
    background:none;border:none;color:var(--ink-soft);
    cursor:pointer;font-size:13px;padding:4px 6px;border-radius:6px;
  }
  .del-btn:hover{color:var(--stamp);background:#FBEAE8;}
  .edit-btn{
    background:none;border:none;color:var(--gold-deep);
    cursor:pointer;font-size:13px;padding:4px 6px;border-radius:6px;
  }
  .edit-btn:hover{background:#FBF0DC;}
  .rank-cell{width:1%;white-space:nowrap;}
  .rank-controls{
    display:flex;
    align-items:center;
    gap:4px;
  }
  .rank-num{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:13px;
    color:var(--ink-soft);
    min-width:16px;
    text-align:center;
  }
  .move-btn{
    background:none;
    border:1px solid var(--line-soft);
    border-radius:5px;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:10px;
    line-height:1;
    padding:4px 5px;
  }
  .move-btn:hover:not(:disabled){border-color:var(--gold-deep);color:var(--gold-deep);}
  .move-btn:disabled{opacity:0.25;cursor:default;}
  .empty-state{
    text-align:center;
    padding:36px 16px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .totals{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#F7F1E4;
    border-radius:10px;
    padding:14px 16px;
    margin-top:14px;
  }
  .totals .t-item{text-align:center;flex:1;}
  .totals .t-item .v{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:18px;
    color:var(--gold-deep);
  }
  .totals .t-item .l{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .status{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:10px;
  }
  .status.err{color:var(--stamp);}
</style>
</head>
<body>
<div class="wrap">

  <div class="warn-banner" id="warnBanner" style="display:none;">
    <div class="warn-text">⚠️ 這個連結還沒有設定正式場次，請先確認你拿到的是不是正確的活動連結</div>
    <button class="warn-btn" id="warnSwitchBtn">切換到正確場次</button>
  </div>

  <div class="stub">
    <div class="stub-main">
      <div class="stub-eyebrow">團體購票登記</div>
      <div id="titleDisplay" class="stub-title">點兩下編輯場次名稱</div>
      <input id="titleInput" class="stub-title-input" style="display:none" placeholder="輸入場次 / 活動名稱" />
      <button class="stub-edit" id="editTitleBtn">編輯場次名稱</button>
      <div class="deadline-row">
        <div class="deadline-tag" id="deadlineTag">尚未設定截止時間</div>
        <button class="stub-edit" id="editDeadlineBtn">設定截止時間🔒</button>
      </div>
      <div class="event-tag" id="eventTag"></div>
    </div>
    <div class="stub-divider"></div>
    <div class="stub-counter">
      <div class="counter-block">
        <div class="num" id="totalQtyNum">0</div>
        <div class="lbl">總張數</div>
      </div>
      <div class="counter-block">
        <div class="num" id="totalPeopleNum">0</div>
        <div class="lbl">登記人數</div>
      </div>
    </div>
  </div>

  <div class="card event-panel" id="eventPanelWrap">
    <div class="card-header-row" style="margin-bottom:10px;">
      <h2 style="font-size:13px;">📅 場次管理</h2>
      <button class="export-btn" id="toggleEventPanelBtn">切換 / 新增場次</button>
    </div>
    <div id="eventPanelBody" style="display:none;">
      <div class="field" style="margin-bottom:12px;">
        <label>切換到現有場次</label>
        <select id="eventSwitcher">
          <option value="">請選擇場次…</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field" style="flex:1;">
          <label>建立新場次(輸入名稱)</label>
          <input id="inpNewEvent" type="text" placeholder="例如 0801演唱會" />
        </div>
      </div>
      <button class="submit-btn" id="createEventBtn" style="margin-top:10px;">建立並前往新場次</button>
      <div class="hint">建立後會自動產生新連結並切換過去，之後把新連結分享出去即可，舊場次資料不會受影響。</div>
    </div>
  </div>

  <div class="card" id="registerCard">
    <h2>填寫我的登記</h2>
    <div class="field-row">
      <div class="field name">
        <label>姓名</label>
        <input id="inpName" type="text" placeholder="你的名字" />
      </div>
      <div class="field qty">
        <label>張數</label>
        <input id="inpQty" type="number" min="1" placeholder="2" />
      </div>
      <div class="field price">
        <label>單張願付金額</label>
        <input id="inpPrice" type="number" min="0" placeholder="1500" />
        <label class="price-check">
          <input type="checkbox" id="inpNoPrice" />
          不限金額，有票就好
        </label>
      </div>
    </div>
    <button class="submit-btn" id="submitBtn">送出 / 更新我的登記</button>
    <div class="hint">同名會覆蓋成最新的登記內容，之後想改張數或金額直接重填送出即可。</div>
    <div class="status" id="statusMsg"></div>
  </div>

  <div class="card" id="volunteerCard">
    <h2>🙋 自願幫忙搶票</h2>
    <div class="field-row">
      <div class="field name" style="flex:1;">
        <label>姓名</label>
        <input id="inpVolunteer" type="text" placeholder="有空幫忙搶票就填這裡" />
      </div>
    </div>
    <button class="submit-btn" id="volunteerBtn" style="background:var(--gold-deep);">我也要幫忙搶票</button>
    <div id="volunteerList" class="volunteer-list"></div>
  </div>

  <div class="card list-card">
    <div class="card-header-row">
      <h2>大家的登記</h2>
      <button class="export-btn" id="exportBtn">匯出 Excel</button>
    </div>
    <div id="tableWrap"></div>
    <div class="totals">
      <div class="t-item">
        <div class="v" id="sumQty">0</div>
        <div class="l">總張數</div>
      </div>
      <div class="t-item">
        <div class="v" id="sumAmount">$0</div>
        <div class="l">總金額</div>
      </div>
      <div class="t-item">
        <div class="v" id="sumPeople">0</div>
        <div class="l">人數</div>
      </div>
    </div>
    <div class="hint" id="unpricedNote" style="text-align:center;margin-top:6px;"></div>
  </div>

</div>

<script>
// ⚠️ 部署 Apps Script 後，把下面換成你的「網頁應用程式網址」
// 範例：https://script.google.com/macros/s/AKfycb.../exec
const API_URL = 'https://script.google.com/macros/s/AKfycbyljXc7_XkYqXE4zMDdjPtaCjFs3W5749Ec4nYIbJhF6uXV0MSucoyfy9NSFkvO_IkX/exec';

// ⚠️ 主辦人專用密碼，只用來保護「設定截止時間」，改成你自己想用的密碼即可
const ORGANIZER_PIN = '0824';

const ORDERS_KEY = 'orders';
const TITLE_KEY = 'event-title';
const VOLUNTEERS_KEY = 'volunteers';
const EVENT_ID = new URLSearchParams(window.location.search).get('event') || 'default';

const el = (id) => document.getElementById(id);
let ordersCache = [];
let volunteersCache = [];
let isEventConfigured = false;
let currentDeadline = '';

function isDeadlinePassed(){
  if(!currentDeadline) return false;
  return Date.now() > new Date(currentDeadline).getTime();
}

function applyLockState(){
  const banner = el('warnBanner');
  const bannerText = banner.querySelector('.warn-text');
  const warnBtn = el('warnSwitchBtn');
  const registerCard = el('registerCard');
  const volunteerCard = el('volunteerCard');

  const deadlinePassed = isDeadlinePassed();
  const locked = !isEventConfigured || deadlinePassed;

  if(!locked){
    banner.style.display = 'none';
    registerCard.classList.remove('form-locked');
    volunteerCard.classList.remove('form-locked');
    return;
  }

  banner.style.display = 'flex';
  registerCard.classList.add('form-locked');
  volunteerCard.classList.add('form-locked');

  if(!isEventConfigured){
    bannerText.textContent = '⚠️ 這個連結還沒有設定正式場次，請先確認你拿到的是不是正確的活動連結';
    warnBtn.style.display = 'inline-block';
  }else if(deadlinePassed){
    const d = new Date(currentDeadline);
    bannerText.textContent = `⏰ 這場登記已於 ${d.toLocaleString('zh-TW')} 截止，無法再填寫或修改`;
    warnBtn.style.display = 'none';
  }
}
const tableWrap = el('tableWrap');
const statusMsg = el('statusMsg');

function setStatus(msg, isErr){
  statusMsg.textContent = msg || '';
  statusMsg.className = 'status' + (isErr ? ' err' : '');
}

function fmtMoney(n){
  return '$' + Number(n).toLocaleString();
}

async function loadOrders(){
  try{
    const res = await fetch(`${API_URL}?action=getOrders&event=${encodeURIComponent(EVENT_ID)}`);
    return await res.json();
  }catch(e){
    return [];
  }
}

async function upsertOrderAPI(entry){
  try{
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'upsertOrder', event: EVENT_ID, data: entry })
    });
    return true;
  }catch(e){
    return false;
  }
}

async function deleteOrderAPI(name){
  try{
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'deleteOrder', event: EVENT_ID, name })
    });
    return true;
  }catch(e){
    return false;
  }
}

async function moveOrderAPI(name, direction){
  try{
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'moveOrder', event: EVENT_ID, name, direction })
    });
    return true;
  }catch(e){
    return false;
  }
}

async function loadTitle(){
  try{
    const res = await fetch(`${API_URL}?action=getTitle&event=${encodeURIComponent(EVENT_ID)}`);
    const data = await res.json();
    return data.title || '';
  }catch(e){
    return '';
  }
}

async function saveTitle(t){
  try{
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'saveTitle', event: EVENT_ID, data: t })
    });
  }catch(e){}
}

async function loadDeadline(){
  try{
    const res = await fetch(`${API_URL}?action=getDeadline&event=${encodeURIComponent(EVENT_ID)}`);
    const data = await res.json();
    return data.deadline || '';
  }catch(e){
    return '';
  }
}

async function saveDeadline(iso){
  try{
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'saveDeadline', event: EVENT_ID, data: iso })
    });
    return true;
  }catch(e){
    return false;
  }
}

async function loadVolunteers(){
  try{
    const res = await fetch(`${API_URL}?action=getVolunteers&event=${encodeURIComponent(EVENT_ID)}`);
    return await res.json();
  }catch(e){
    return [];
  }
}

async function addVolunteerAPI(entry){
  try{
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'addVolunteer', event: EVENT_ID, data: entry })
    });
    return true;
  }catch(e){
    return false;
  }
}

async function removeVolunteerAPI(name){
  try{
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'removeVolunteer', event: EVENT_ID, name })
    });
    return true;
  }catch(e){
    return false;
  }
}

function renderVolunteers(list){
  const wrap = el('volunteerList');
  if(!list.length){
    wrap.innerHTML = '<div class="volunteer-empty">目前還沒有人自願幫忙搶票</div>';
    return;
  }
  const sorted = [...list].sort((a,b) => a.ts - b.ts);
  wrap.innerHTML = sorted.map(v => `
    <div class="volunteer-chip">
      ${escapeHtml(v.name)}
      <button data-name="${escapeHtml(v.name)}" title="移除">✕</button>
    </div>
  `).join('');

  wrap.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      if(btn.disabled) return;
      const name = btn.getAttribute('data-name');
      const optimistic = list.filter(v => v.name !== name);
      volunteersCache = optimistic;
      renderVolunteers(optimistic);

      removeVolunteerAPI(name).then(ok => {
        if(!ok) setStatus('移除志工失敗，請再試一次', true);
      });
    });
  });
}

function renderTable(list){
  if(!list.length){
    tableWrap.innerHTML = '<div class="empty-state">還沒有人登記，第一個填寫上面的表單吧</div>';
    return;
  }
  let rows = list.map((o, idx) => {
    const hasPrice = o.price !== null && o.price !== undefined;
    const priceCell = hasPrice ? fmtMoney(o.price) : '<span class="no-price-tag">不限金額</span>';
    const subtotalCell = hasPrice ? fmtMoney(o.qty * o.price) : '<span class="no-price-tag">—</span>';
    const isFirst = idx === 0;
    const isLast = idx === list.length - 1;
    return `<tr>
      <td class="rank-cell">
        <div class="rank-controls">
          <button class="move-btn" data-idx="${idx}" data-dir="up" ${isFirst ? 'disabled' : ''}>▲</button>
          <span class="rank-num">${idx + 1}</span>
          <button class="move-btn" data-idx="${idx}" data-dir="down" ${isLast ? 'disabled' : ''}>▼</button>
        </div>
      </td>
      <td class="name-cell">${escapeHtml(o.name)}</td>
      <td class="num-col">${o.qty}</td>
      <td class="num-col">${priceCell}</td>
      <td class="num-col">${subtotalCell}</td>
      <td style="text-align:right;white-space:nowrap;">
        <button class="edit-btn" data-name="${escapeHtml(o.name)}">編輯</button>
        <button class="del-btn" data-name="${escapeHtml(o.name)}">刪除</button>
      </td>
    </tr>`;
  }).join('');

  tableWrap.innerHTML = `<table>
    <thead>
      <tr>
        <th>順序</th>
        <th>姓名</th>
        <th class="num-col">張數</th>
        <th class="num-col">單張金額</th>
        <th class="num-col">小計</th>
        <th></th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>`;

  tableWrap.querySelectorAll('.move-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if(btn.disabled) return;
      const idx = parseInt(btn.getAttribute('data-idx'), 10);
      const dir = btn.getAttribute('data-dir');
      const targetIdx = dir === 'up' ? idx - 1 : idx + 1;
      if(targetIdx < 0 || targetIdx >= list.length) return;
      const name = list[idx].name;

      const optimistic = [...list];
      [optimistic[idx], optimistic[targetIdx]] = [optimistic[targetIdx], optimistic[idx]];
      setOrders(optimistic);

      moveOrderAPI(name, dir).then(ok => {
        if(!ok) setStatus('順序更新失敗，畫面可能與試算表不同步，請重新整理', true);
      });
    });
  });

  tableWrap.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.getAttribute('data-name');
      const entry = list.find(o => o.name === name);
      if(!entry) return;

      el('inpName').value = entry.name;
      el('inpQty').value = entry.qty;
      const hasPrice = entry.price !== null && entry.price !== undefined;
      noPriceCheck.checked = !hasPrice;
      priceInput.disabled = !hasPrice;
      priceInput.value = hasPrice ? entry.price : '';

      setStatus(`正在編輯「${name}」的登記，改完按下方送出即可更新`, false);
      el('inpName').scrollIntoView({ behavior: 'smooth', block: 'center' });
      el('inpQty').focus();
    });
  });

  tableWrap.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if(btn.disabled) return;
      if(btn.dataset.confirm === '1'){
        const name = btn.getAttribute('data-name');
        const optimistic = list.filter(o => o.name !== name);
        setOrders(optimistic);

        deleteOrderAPI(name).then(ok => {
          if(!ok) setStatus('刪除失敗，畫面可能與試算表不同步，請重新整理', true);
        });
        return;
      }
      btn.dataset.confirm = '1';
      btn.textContent = '確定刪除?';
      btn.style.color = 'var(--stamp)';
      btn.style.fontWeight = '700';
      setTimeout(() => {
        if(btn.isConnected && btn.dataset.confirm === '1'){
          btn.dataset.confirm = '0';
          btn.textContent = '刪除';
          btn.style.color = '';
          btn.style.fontWeight = '';
        }
      }, 2500);
    });
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function updateTotals(list){
  const totalQty = list.reduce((s,o) => s + o.qty, 0);
  const pricedEntries = list.filter(o => o.price !== null && o.price !== undefined);
  const totalAmount = pricedEntries.reduce((s,o) => s + o.qty * o.price, 0);
  const unpricedCount = list.length - pricedEntries.length;
  const totalPeople = list.length;

  el('totalQtyNum').textContent = totalQty;
  el('totalPeopleNum').textContent = totalPeople;
  el('sumQty').textContent = totalQty;
  el('sumAmount').textContent = fmtMoney(totalAmount);
  el('sumPeople').textContent = totalPeople;

  const noteEl = el('unpricedNote');
  noteEl.textContent = unpricedCount ? `金額總計不含 ${unpricedCount} 位「不限金額」的登記` : '';
}

async function refresh(){
  const list = await loadOrders();
  setOrders(list);
}

function setOrders(list){
  ordersCache = list;
  renderTable(list);
  updateTotals(list);
}

const noPriceCheck = el('inpNoPrice');
const priceInput = el('inpPrice');

noPriceCheck.addEventListener('change', () => {
  priceInput.disabled = noPriceCheck.checked;
  if(noPriceCheck.checked){ priceInput.value = ''; }
});

el('submitBtn').addEventListener('click', async () => {
  if(!isEventConfigured){
    setStatus('這個場次還沒有設定名稱，請先切換到正確的場次連結', true);
    openEventPanel();
    return;
  }
  const name = el('inpName').value.trim();
  const qty = parseInt(el('inpQty').value, 10);
  const noPrice = noPriceCheck.checked;
  const priceRaw = priceInput.value;
  const price = noPrice ? null : parseFloat(priceRaw);

  if(!name){ setStatus('請填寫姓名', true); return; }
  if(!qty || qty <= 0){ setStatus('請填寫有效的張數', true); return; }
  if(!noPrice && (isNaN(price) || price < 0)){ setStatus('請填寫願付金額，或勾選「不限金額」', true); return; }

  const newEntry = { name, qty, price: noPrice ? null : price, ts: Date.now() };
  const existingIdx = ordersCache.findIndex(o => o.name === name);
  let optimistic;
  if(existingIdx > -1){
    optimistic = [...ordersCache];
    optimistic[existingIdx] = newEntry;
  }else{
    optimistic = [...ordersCache, newEntry];
  }
  setOrders(optimistic);
  setStatus('已送出，感謝登記！');

  upsertOrderAPI(newEntry).then(ok => {
    if(!ok) setStatus('送出失敗，請再試一次', true);
  });
});

el('volunteerBtn').addEventListener('click', () => {
  if(!isEventConfigured){
    setStatus('這個場次還沒有設定名稱，請先切換到正確的場次連結', true);
    openEventPanel();
    return;
  }
  const nameInput = el('inpVolunteer');
  const name = nameInput.value.trim();
  if(!name) return;
  if(volunteersCache.some(v => v.name === name)){
    nameInput.value = '';
    return;
  }
  nameInput.value = '';

  const optimistic = [...volunteersCache, { name, ts: Date.now() }];
  volunteersCache = optimistic;
  renderVolunteers(optimistic);

  addVolunteerAPI({ name, ts: Date.now() }).then(ok => {
    if(!ok) setStatus('新增志工失敗，請再試一次', true);
  });
});

el('inpVolunteer').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ el('volunteerBtn').click(); }
});

// Title editing
const titleDisplay = el('titleDisplay');
const titleInput = el('titleInput');
const editTitleBtn = el('editTitleBtn');

function enterTitleEdit(){
  titleInput.value = titleDisplay.dataset.raw === 'placeholder' ? '' : titleDisplay.textContent;
  titleDisplay.style.display = 'none';
  titleInput.style.display = 'block';
  titleInput.focus();
}

titleDisplay.addEventListener('dblclick', enterTitleEdit);
editTitleBtn.addEventListener('click', enterTitleEdit);

async function commitTitle(){
  const val = titleInput.value.trim();
  titleInput.style.display = 'none';
  titleDisplay.style.display = 'block';
  if(val){
    titleDisplay.textContent = val;
    titleDisplay.dataset.raw = 'text';
    isEventConfigured = true;
    applyLockState();
    await saveTitle(val);
  }
}

titleInput.addEventListener('blur', commitTitle);
titleInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ titleInput.blur(); }
});

let xlsxLoadPromise = null;
function ensureXlsxLoaded(){
  if(window.XLSX) return Promise.resolve();
  if(xlsxLoadPromise) return xlsxLoadPromise;
  xlsxLoadPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
  return xlsxLoadPromise;
}

el('exportBtn').addEventListener('click', async () => {
  if(!ordersCache.length){
    setStatus('目前還沒有資料可以匯出', true);
    return;
  }
  const exportBtn = el('exportBtn');
  exportBtn.disabled = true;
  exportBtn.textContent = '準備中…';
  try{
    await ensureXlsxLoaded();
  }catch(e){
    setStatus('匯出套件載入失敗，請檢查網路連線後再試一次', true);
    exportBtn.disabled = false;
    exportBtn.textContent = '匯出 Excel';
    return;
  }

  const list = ordersCache;
  const rows = list.map((o, idx) => {
    const hasPrice = o.price !== null && o.price !== undefined;
    return {
      '順序': idx + 1,
      '姓名': o.name,
      '張數': o.qty,
      '單張願付金額': hasPrice ? o.price : '不限金額',
      '小計': hasPrice ? o.qty * o.price : '不限金額',
      '登記時間': new Date(o.ts).toLocaleString('zh-TW')
    };
  });
  const totalQty = list.reduce((s,o) => s + o.qty, 0);
  const pricedEntries = list.filter(o => o.price !== null && o.price !== undefined);
  const totalAmount = pricedEntries.reduce((s,o) => s + o.qty * o.price, 0);
  rows.push({});
  rows.push({ '姓名': '總計', '張數': totalQty, '單張願付金額': '', '小計': totalAmount, '登記時間': '' });

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:6},{wch:14},{wch:8},{wch:14},{wch:12},{wch:20}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '購票登記');

  const volunteers = volunteersCache;
  if(volunteers.length){
    const vRows = [...volunteers].sort((a,b) => a.ts - b.ts).map(v => ({ '姓名': v.name }));
    const wsV = XLSX.utils.json_to_sheet(vRows);
    wsV['!cols'] = [{wch:14}];
    XLSX.utils.book_append_sheet(wb, wsV, '幫搶志工');
  }

  const eventTitle = titleDisplay.dataset.raw === 'text' ? titleDisplay.textContent : '購票登記';
  const filename = `${eventTitle}_購票登記_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, filename);

  exportBtn.disabled = false;
  exportBtn.textContent = '匯出 Excel';
});

async function listEvents(){
  try{
    const res = await fetch(`${API_URL}?action=listEvents`);
    return await res.json();
  }catch(e){
    return [];
  }
}

async function registerCurrentEvent(){
  try{
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'registerEvent', event: EVENT_ID })
    });
  }catch(e){}
}

function buildEventUrl(eventId){
  const url = new URL(window.location.href);
  url.searchParams.set('event', eventId);
  return url.toString();
}

async function openEventPanel(){
  const body = el('eventPanelBody');
  body.style.display = 'block';
  const events = await listEvents();
  const switcher = el('eventSwitcher');
  switcher.innerHTML = '<option value="">請選擇場次…</option>' + events.map(ev => {
    const label = ev.title ? `${ev.title}（${ev.event}）` : `${ev.event}（尚未設定標題）`;
    const selected = ev.event === EVENT_ID ? 'selected' : '';
    return `<option value="${escapeHtml(ev.event)}" ${selected}>${escapeHtml(label)}</option>`;
  }).join('');
  el('eventPanelWrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

el('toggleEventPanelBtn').addEventListener('click', () => {
  const body = el('eventPanelBody');
  const isHidden = body.style.display === 'none';
  if(isHidden){
    openEventPanel();
  }else{
    body.style.display = 'none';
  }
});

el('warnSwitchBtn').addEventListener('click', () => {
  openEventPanel();
});

el('eventSwitcher').addEventListener('change', (e) => {
  const chosen = e.target.value;
  if(chosen && chosen !== EVENT_ID){
    window.location.href = buildEventUrl(chosen);
  }
});

el('createEventBtn').addEventListener('click', async () => {
  const name = el('inpNewEvent').value.trim();
  if(!name){
    setStatus('請先填寫新場次的名稱', true);
    return;
  }
  const slug = name.replace(/\s+/g, '-');
  el('createEventBtn').disabled = true;
  setStatus('建立場次中…');
  try{
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'saveTitle', event: slug, data: name })
    });
    window.location.href = buildEventUrl(slug);
  }catch(e){
    setStatus('建立失敗，請再試一次', true);
    el('createEventBtn').disabled = false;
  }
});

async function init(){
  if(API_URL.includes('PASTE_YOUR')){
    setStatus('⚠️ 尚未設定 API_URL，請先部署 Apps Script 並貼上網址（見程式碼開頭註解）', true);
    return;
  }
  el('eventTag').textContent = `場次代碼:${EVENT_ID}`;

  const [, title, deadline, orders, volunteers] = await Promise.all([
    registerCurrentEvent(),
    loadTitle(),
    loadDeadline(),
    loadOrders(),
    loadVolunteers()
  ]);

  if(title){
    titleDisplay.textContent = title;
    titleDisplay.dataset.raw = 'text';
    isEventConfigured = true;
  }else{
    titleDisplay.dataset.raw = 'placeholder';
    isEventConfigured = false;
  }

  currentDeadline = deadline;
  renderDeadlineTag();
  applyLockState();

  setOrders(orders);
  volunteersCache = volunteers;
  renderVolunteers(volunteers);

  setInterval(() => {
    renderDeadlineTag();
    applyLockState();
  }, 30000);
}

function renderDeadlineTag(){
  const tag = el('deadlineTag');
  if(!currentDeadline){
    tag.textContent = '尚未設定截止時間';
    tag.classList.remove('passed');
    return;
  }
  const d = new Date(currentDeadline);
  const label = `登記截止:${d.toLocaleString('zh-TW')}`;
  if(isDeadlinePassed()){
    tag.textContent = `${label}（已截止）`;
    tag.classList.add('passed');
  }else{
    tag.textContent = label;
    tag.classList.remove('passed');
  }
}

el('editDeadlineBtn').addEventListener('click', async () => {
  const pin = prompt('請輸入主辦人密碼以設定截止時間：');
  if(pin === null) return;
  if(pin !== ORGANIZER_PIN){
    alert('密碼錯誤，只有主辦人能設定截止時間');
    return;
  }
  const current = currentDeadline ? new Date(currentDeadline) : null;
  const defaultVal = current ? current.toISOString().slice(0,16) : '';
  const input = prompt('請輸入截止時間（格式：YYYY-MM-DDTHH:MM，例如 2026-08-10T20:00），留空可清除截止時間：', defaultVal);
  if(input === null) return;
  const trimmed = input.trim();
  if(!trimmed){
    currentDeadline = '';
    renderDeadlineTag();
    applyLockState();
    await saveDeadline('');
    return;
  }
  const parsed = new Date(trimmed);
  if(isNaN(parsed.getTime())){
    alert('時間格式看起來不太對，請照範例格式輸入');
    return;
  }
  currentDeadline = parsed.toISOString();
  renderDeadlineTag();
  applyLockState();
  await saveDeadline(currentDeadline);
});

init();
</script>
